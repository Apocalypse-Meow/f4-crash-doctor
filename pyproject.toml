[project]
name = "f4-crash-doctor"
version = "0.1.1"
description = "Advisory-only Fallout 4 crash diagnosis MCP server (F4 Crash Doctor) — reads Buffout 4 crash logs, load order and game environment; never writes files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.scripts]
f4-crash-doctor = "f4_crash_doctor.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/f4_crash_doctor"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
